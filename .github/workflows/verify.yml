name: Verify School LMS

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: school_lms_test
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: local-ci-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test -d school_lms_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.12-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LMS_TEST_DATABASE_URL: postgresql+psycopg://lms_test:local-ci-database@127.0.0.1:5432/school_lms_test
      LMS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest --cov=app --cov-report=term-missing tests
      - run: |
          export DATABASE_URL="$LMS_TEST_DATABASE_URL"
          export JWT_SECRET="$(openssl rand -hex 32)"
          python -m alembic upgrade head --sql > /tmp/school-lms-migration.sql
      - run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run typecheck:all
      - run: npm run test:coverage -- --pool=threads --maxWorkers=2
      - run: node --test --test-isolation=none test_chat_date.js
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  release-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      LMS_DOMAIN: localhost
      DB_PASSWORD: local-ci-database
      DATABASE_URL: postgresql+psycopg://postgres:local-ci-database@db:5432/school_lms_db
    steps:
      - uses: actions/checkout@v4
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: |
          curl --insecure --fail --retry 6 --retry-all-errors https://localhost/health/ready
          curl --insecure --fail --retry 6 --retry-all-errors https://localhost/ > /tmp/school-lms-frontend.html
          grep -q '/assets/' /tmp/school-lms-frontend.html
      - if: failure()
        run: docker compose logs migrate backend caddy
      - if: always()
        run: docker compose down --volumes
