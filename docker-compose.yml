services:

  # ─────────────────────────────────────────────────
  # SERVICE 1: PostgreSQL Database
  # ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeMeToSomethingStrong123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────
  # SERVICE 2: FastAPI Backend Application
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-ChangeMeToSomethingStrong123!}@db:5432/school_lms_db
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret-string}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FRONTEND_URL: ${FRONTEND_URL:-http://13.211.230.212,http://localhost:5173}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@platform.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-Admin@123}
      ADMIN_DEFAULT_FIRST_NAME: ${ADMIN_DEFAULT_FIRST_NAME:-Admin}
      ADMIN_DEFAULT_LAST_NAME: ${ADMIN_DEFAULT_LAST_NAME:-User}
      ADMIN_DEFAULT_MOBILE: ${ADMIN_DEFAULT_MOBILE:-9999999999}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # ─────────────────────────────────────────────────
  # SERVICE 3: Caddy — Web Server & Reverse Proxy
  # ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./Frontend/dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
