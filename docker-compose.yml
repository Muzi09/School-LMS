x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  FRONTEND_URL: https://${LMS_DOMAIN:?Set LMS_DOMAIN}
  ACCESS_TOKEN_EXPIRE_MINUTES: 60
  SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:-}
  SMTP_ALLOWED_HOSTS: ${SMTP_ALLOWED_HOSTS:-smtp.gmail.com,smtp.office365.com,smtp.mail.yahoo.com}
  CHAT_REDIS_URL: redis://redis:6379/0
  FORWARDED_ALLOW_IPS: "*"

services:
  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4.12-alpine3.22
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: ./Backend
    environment: *backend-env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./Backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      LMS_DOMAIN: ${LMS_DOMAIN:?Set LMS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
